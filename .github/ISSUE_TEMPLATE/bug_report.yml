name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command used
      description: The CLI command you ran
      placeholder: python3 -m shopify_csv_cli example.com --output products.csv
  - type: textarea
    id: logs
    attributes:
      label: Logs / errors
      description: Paste relevant output or stack traces
      render: shell
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Clear steps to reproduce
    validations:
      required: true
